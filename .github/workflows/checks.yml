name: Threshold checks
on:
  push:
  pull_request:
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_PRIVY_APP_ID: cmvtobqlq01yz0gl0bv6v86l2
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install genvm-linter
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/genvm
            ~/.cache/gltest-direct
          key: genvm-${{ runner.os }}-threshold-v0216
      - run: npm run contracts:lint
      - run: pytest tests/direct -q --tb=short
